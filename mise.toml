[tools]
cmake = "4.2.1"
conan = "2.28.1"

[env]
CCACHE_DIR = "{{config_root}}/.cache/ccache"

[tasks.configure]
description = "Configura o projeto com CMake usando o decoder TRD"
run = "mkdir -p .cache/ccache && cmake -S . -B build && ln -sf build/compile_commands.json compile_commands.json"

[tasks.build]
description = "Compila o projeto com CMake"
depends = ["configure"]
run = "cmake --build build && ln -sf build/compile_commands.json compile_commands.json"

[tasks.run]
description = "Compila e executa o programa principal"
depends = ["build"]
run = "./build/multi_agentes data/trd_graph.txt"

[tasks.docs]
description = "Gera a documentacao Doxygen"
depends = ["configure"]
run = "cmake --build build --target docs"

[tasks.clean]
description = "Remove artefatos de build e documentacao gerada"
run = "cmake -E rm -rf build docs/doxygen compile_commands.json"
